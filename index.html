<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就活トラッカー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: #e8e5df;
    --text: #1a1a1a;
    --text-muted: #888;
    --accent: #2d6a4f;
    --accent-light: #e8f5ee;
    --nav-h: 56px;
    --topbar-h: 52px;
    --stats-h: 48px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }

  /* ===== PC LAYOUT ===== */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    height: 100vh;
  }

  .sidebar {
    background: var(--text); color: #fff;
    padding: 32px 20px;
    display: flex; flex-direction: column; gap: 32px;
    height: 100vh; overflow-y: auto;
  }
  .sidebar h1 { font-size: 16px; font-weight: 700; letter-spacing: .04em; }
  .sidebar h1 span { color: var(--accent); }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-btn {
    background: none; border: none; color: #aaa;
    font-family: inherit; font-size: 13px;
    padding: 10px 12px; border-radius: 6px;
    cursor: pointer; text-align: left; transition: all .15s;
  }
  .nav-btn:hover, .nav-btn.active { background: rgba(255,255,255,.08); color: #fff; }
  .nav-btn.active { font-weight: 500; }
  .sidebar-stats { margin-top: auto; }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .stat-row:last-child { border: none; }
  .stat-label { color: #888; font-size: 12px; }
  .stat-val { font-weight: 600; font-size: 13px; font-family: 'DM Mono', monospace; }

  /* MAIN = flex column, fills grid cell */
  .main {
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }

  .topbar {
    flex-shrink: 0;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 28px; height: var(--topbar-h);
    display: flex; align-items: center; gap: 12px;
  }
  .topbar h2 { font-size: 15px; font-weight: 600; flex: 1; }

  .btn-primary {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 16px; border-radius: 6px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .85; }
  .btn-secondary {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 6px;
    font-family: inherit; font-size: 13px;
    cursor: pointer; transition: background .15s;
  }
  .btn-secondary:hover { background: var(--bg); }

  /* スクロールするのはここだけ */
  .content {
    flex: 1; min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 24px 28px;
  }

  /* ===== LIST ===== */
  .list-filters {
    display: flex; gap: 8px; margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-chip {
    border: 1px solid var(--border); background: var(--surface);
    padding: 5px 12px; border-radius: 99px; font-size: 12px;
    cursor: pointer; transition: all .15s; color: var(--text-muted);
    white-space: nowrap; flex-shrink: 0;
  }
  .filter-chip:hover, .filter-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .company-table { width: 100%; border-collapse: collapse; }
  .company-table th {
    text-align: left; font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-muted); padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  .company-table td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .company-table tr:hover td { background: var(--bg); cursor: pointer; }
  .company-name { font-weight: 600; font-size: 14px; }
  .company-role { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* スマホ用カード（PC では非表示） */
  .company-cards { display: none; flex-direction: column; gap: 10px; }
  .company-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
    cursor: pointer; display: flex; align-items: center; gap: 12px;
  }
  .company-card:active { opacity: .7; }
  .card-left { flex: 1; min-width: 0; }
  .card-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-role { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .card-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; gap: 8px; align-items: center; }
  .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }

  .status-badge {
    display: inline-block; padding: 3px 10px; border-radius: 99px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .deadline-near { color: #e74c3c; font-weight: 600; font-family: 'DM Mono', monospace; font-size: 12px; }
  .deadline-ok   { color: var(--text-muted); font-family: 'DM Mono', monospace; font-size: 12px; }

  /* ===== CALENDAR ===== */
  .cal-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .cal-header h3 { font-size: 17px; font-weight: 600; }
  .cal-nav { background: none; border: 1px solid var(--border); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 16px; }
  .cal-nav:hover { background: var(--bg); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .cal-day-header { background: var(--surface); text-align: center; padding: 6px 2px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .cal-cell {
    background: var(--surface); height: 80px; padding: 4px;
    overflow: hidden; display: flex; flex-direction: column; gap: 2px;
  }
  .cal-cell.other-month { background: var(--bg); }
  .cal-cell.today { background: #fffdf0; }
  .cal-date { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .cal-cell.today .cal-date { color: var(--accent); }
  .cal-event { font-size: 9px; padding: 2px 3px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; font-weight: 500; }
  .cal-more { font-size: 9px; color: var(--text-muted); }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.45); z-index: 200;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 16px 16px 0 0;
    padding: 20px 20px 40px; width: 100%; max-width: 560px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 -4px 40px rgba(0,0,0,.15);
    animation: slideUp .2s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .drag-bar { width: 40px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 20px; }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; letter-spacing: .06em; text-transform: uppercase; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-family: inherit; font-size: 16px;
    background: var(--bg); color: var(--text); transition: border-color .15s;
    -webkit-appearance: none; appearance: none;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 72px; font-size: 14px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn-danger { background: #e74c3c; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; }

  /* ===== DETAIL PANEL ===== */
  .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 150; }
  .detail-overlay.open { display: block; }
  .detail-panel {
    position: fixed; right: 0; top: 0; bottom: 0; width: 360px;
    background: var(--surface); border-left: 1px solid var(--border);
    z-index: 151; padding: 28px; overflow-y: auto;
    transform: translateX(100%); transition: transform .25s;
  }
  .detail-panel.open { transform: translateX(0); }
  .detail-panel h3 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .detail-role { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
  .detail-section { margin-bottom: 20px; }
  .detail-section h4 { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .event-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .event-item:last-child { border: none; }
  .event-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .ev-title { font-size: 13px; font-weight: 500; }
  .ev-date { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
  .detail-note { font-size: 13px; line-height: 1.7; color: #555; background: var(--bg); padding: 12px; border-radius: 6px; }
  .detail-actions { display: flex; gap: 8px; margin-top: 20px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state p { margin-top: 8px; font-size: 13px; }

  /* FAB */
  .fab {
    display: none; position: fixed;
    right: 20px; bottom: calc(var(--nav-h) + 16px);
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none;
    font-size: 26px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(45,106,79,.4);
    align-items: center; justify-content: center; z-index: 50;
  }

  /* スマホ用ボトムナビ */
  .mobile-nav { display: none; }

  /* ===== MOBILE ===== */
  @media (max-width: 768px) {
    /* グリッドを1列に */
    .app { grid-template-columns: 1fr; height: 100dvh; }
    .sidebar { display: none; }

    /* main = 画面全体を縦に分割 */
    .main { height: 100dvh; }

    /* トップバー */
    .topbar { padding: 0 16px; height: var(--topbar-h); }
    .topbar .btn-secondary { display: none; }

    /* サマリーバー */
    .mobile-stats {
      flex-shrink: 0;
      display: flex; background: var(--surface);
      border-bottom: 1px solid var(--border);
      height: var(--stats-h);
    }
    .mobile-stat {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-right: 1px solid var(--border);
    }
    .mobile-stat:last-child { border-right: none; }
    .mobile-stat-val { font-size: 18px; font-weight: 700; font-family: 'DM Mono', monospace; line-height: 1; }
    .mobile-stat-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    /* コンテンツ: 残り高さをすべて使い、ここだけスクロール */
    .content {
      padding: 12px 14px;
      /* height = 全体 - topbar - stats - bottomnav */
      height: calc(100dvh - var(--topbar-h) - var(--stats-h) - var(--nav-h));
      flex: none; /* flex:1 を上書き */
    }

    /* フィルター横スクロール */
    .list-filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    .list-filters::-webkit-scrollbar { display: none; }

    /* テーブル → カード */
    .company-table { display: none; }
    .company-cards { display: flex; }

    /* 詳細パネル → ボトムシート */
    .detail-panel {
      width: 100%; top: auto; right: 0; bottom: 0;
      height: 82dvh; border-left: none;
      border-radius: 16px 16px 0 0;
      border-top: 1px solid var(--border);
      padding: 16px 20px 32px;
      transform: translateY(100%);
    }
    .detail-panel.open { transform: translateY(0); }

    /* ボトムナビ */
    .mobile-nav {
      display: flex; position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h); background: var(--surface);
      border-top: 1px solid var(--border); z-index: 100;
    }
    .mobile-nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; background: none; border: none;
      cursor: pointer; font-family: inherit;
      color: var(--text-muted); font-size: 10px;
    }
    .mobile-nav-btn.active { color: var(--accent); }
    .mobile-nav-btn .icon { font-size: 20px; }

    /* FAB */
    .fab { display: flex; }

    /* カレンダーセルをコンパクトに */
    .cal-cell { height: 56px; padding: 3px 2px; }
  }

  @media (min-width: 769px) {
    .mobile-stats { display: none; }
    .fab { display: none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- PC サイドバー -->
  <aside class="sidebar">
    <div><h1>就活<span>トラッカー</span></h1></div>
    <nav>
      <button class="nav-btn active" onclick="switchView('list')">📋 企業一覧</button>
      <button class="nav-btn" onclick="switchView('calendar')">📅 カレンダー</button>
    </nav>
    <div class="sidebar-stats" id="sidebar-stats"></div>
  </aside>

  <main class="main">
    <!-- トップバー -->
    <div class="topbar">
      <h2 id="view-title">企業一覧</h2>
      <button class="btn-secondary" onclick="openModal()">＋ 企業を追加</button>
    </div>
    <!-- スマホ サマリーバー -->
    <div class="mobile-stats" id="mobile-stats" style="display:none"></div>
    <!-- スクロールするのはここだけ -->
    <div class="content" id="content"></div>
  </main>
</div>

<!-- スマホ ボトムナビ -->
<nav class="mobile-nav">
  <button class="mobile-nav-btn active" id="mnav-list" onclick="switchView('list')">
    <span class="icon">📋</span>一覧
  </button>
  <button class="mobile-nav-btn" id="mnav-calendar" onclick="switchView('calendar')">
    <span class="icon">📅</span>カレンダー
  </button>
</nav>

<!-- スマホ FAB -->
<button class="fab" onclick="openModal()">＋</button>

<!-- モーダル -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="drag-bar"></div>
    <h3 id="modal-title">企業を追加</h3>
    <div class="form-row">
      <div class="form-group">
        <label>企業名 *</label>
        <input type="text" id="f-name" placeholder="株式会社〇〇">
      </div>
      <div class="form-group">
        <label>職種</label>
        <input type="text" id="f-role" placeholder="エンジニア">
      </div>
    </div>
    <div class="form-group">
      <label>ステータス</label>
      <select id="f-status">
        <option value="es">ES提出</option>
        <option value="doc">書類選考中</option>
        <option value="gd">グループディスカッション</option>
        <option value="1st">一次面接</option>
        <option value="2nd">二次面接</option>
        <option value="final">最終面接</option>
        <option value="other">その他面接・面談</option>
        <option value="offer">内定</option>
        <option value="fail">不合格</option>
      </select>
    </div>
    <div class="form-group" style="margin-bottom:6px;">
      <label>イベント・締め切り</label>
    </div>
    <div id="event-list"></div>
    <button class="btn-secondary" style="font-size:13px;padding:10px;width:100%;margin-bottom:14px;" onclick="addEventField()">＋ イベントを追加</button>
    <div class="form-group">
      <label>メモ</label>
      <textarea id="f-note" placeholder="準備すること・気になる点など"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" id="btn-delete" style="display:none;margin-right:auto;" onclick="deleteCompany()">削除</button>
      <button class="btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn-primary" onclick="saveCompany()">保存</button>
    </div>
  </div>
</div>

<!-- 詳細パネル -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <div class="drag-bar" id="detail-drag" style="display:none"></div>
  <div id="detail-content"></div>
</div>

<script>
const STATUS_META = {
  es:    { label: 'ES提出',           color: '#4a90d9' },
  doc:   { label: '書類選考中',        color: '#9b59b6' },
  gd:    { label: 'GD',              color: '#e67e22' },
  '1st': { label: '一次面接',         color: '#2980b9' },
  '2nd': { label: '二次面接',         color: '#16a085' },
  final: { label: '最終面接',         color: '#8e44ad' },
  other: { label: 'その他面接・面談',  color: '#d35400' },
  offer: { label: '内定',             color: '#27ae60' },
  fail:  { label: '不合格',           color: '#bdc3c7' },
};
const EVENT_TYPES = ['ES締切', '書類締切', 'GD', '一次面接', '二次面接', '最終面接', '説明会', 'その他'];

let companies = JSON.parse(localStorage.getItem('jt_companies') || '[]');
let currentView = 'list', editingId = null, filterStatus = 'all';
let calYear, calMonth;
const today = new Date();
calYear = today.getFullYear(); calMonth = today.getMonth();

const save  = () => localStorage.setItem('jt_companies', JSON.stringify(companies));
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const esc   = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate  = d => { const dt=new Date(d); return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`; };
const fmtShort = d => { const dt=new Date(d); return `${dt.getMonth()+1}/${dt.getDate()}`; };
const mobile   = () => window.innerWidth <= 768;

function nextEvent(c) {
  if (!c.events?.length) return null;
  const now = new Date(today.toDateString());
  return c.events.filter(e => e.date && new Date(e.date) >= now)
    .sort((a,b) => new Date(a.date)-new Date(b.date))[0] || null;
}
const nearestDate = c => { const e=nextEvent(c); return e?e.date:null; };

// ====== VIEW ======
function switchView(v) {
  currentView = v;
  document.querySelectorAll('.nav-btn').forEach((b,i) =>
    b.classList.toggle('active', (i===0&&v==='list')||(i===1&&v==='calendar')));
  document.getElementById('mnav-list').classList.toggle('active', v==='list');
  document.getElementById('mnav-calendar').classList.toggle('active', v==='calendar');
  document.getElementById('view-title').textContent = v==='list' ? '企業一覧' : 'カレンダー';
  render();
}

function render() { renderStats(); currentView==='list' ? renderList() : renderCalendar(); }

function renderStats() {
  const cnt = {}; Object.keys(STATUS_META).forEach(k=>cnt[k]=0);
  companies.forEach(c => cnt[c.status]=(cnt[c.status]||0)+1);
  const active = companies.filter(c=>!['offer','fail'].includes(c.status)).length;

  document.getElementById('sidebar-stats').innerHTML = `
    <div class="stat-row"><span class="stat-label">登録企業</span><span class="stat-val">${companies.length}</span></div>
    <div class="stat-row"><span class="stat-label">内定</span><span class="stat-val" style="color:#27ae60">${cnt.offer||0}</span></div>
    <div class="stat-row"><span class="stat-label">選考中</span><span class="stat-val">${active}</span></div>
    <div class="stat-row"><span class="stat-label">不合格</span><span class="stat-val" style="color:#bdc3c7">${cnt.fail||0}</span></div>`;

  const ms = document.getElementById('mobile-stats');
  ms.style.display = mobile() ? 'flex' : 'none';
  ms.innerHTML = `
    <div class="mobile-stat"><div class="mobile-stat-val">${companies.length}</div><div class="mobile-stat-label">登録</div></div>
    <div class="mobile-stat"><div class="mobile-stat-val" style="color:#27ae60">${cnt.offer||0}</div><div class="mobile-stat-label">内定</div></div>
    <div class="mobile-stat"><div class="mobile-stat-val">${active}</div><div class="mobile-stat-label">選考中</div></div>
    <div class="mobile-stat"><div class="mobile-stat-val" style="color:#bdc3c7">${cnt.fail||0}</div><div class="mobile-stat-label">不合格</div></div>`;
}

// ====== LIST ======
function renderList() {
  const chips = ['all', ...Object.keys(STATUS_META)];
  const filtered = filterStatus==='all' ? companies : companies.filter(c=>c.status===filterStatus);
  const sorted = [...filtered].sort((a,b) => {
    const na=nearestDate(a), nb=nearestDate(b);
    if (!na&&!nb) return 0; if (!na) return 1; if (!nb) return -1;
    return new Date(na)-new Date(nb);
  });

  const filters = `<div class="list-filters">${chips.map(s=>`
    <button class="filter-chip ${filterStatus===s?'active':''}" onclick="setFilter('${s}')">
      ${s==='all'?'すべて':STATUS_META[s].label}
    </button>`).join('')}</div>`;

  if (!sorted.length) {
    document.getElementById('content').innerHTML = filters +
      `<div class="empty-state"><div style="font-size:40px">📂</div><p>企業を追加してください</p></div>`;
    return;
  }

  const rows = sorted.map(c => {
    const ev=nextEvent(c), nd=nearestDate(c);
    const near = nd && (new Date(nd)-today)/86400000 < 7;
    const sm = STATUS_META[c.status];
    return {c, ev, nd, near, sm};
  });

  const table = `<table class="company-table">
    <thead><tr><th>企業名</th><th>ステータス</th><th>次のイベント</th><th>日程</th></tr></thead>
    <tbody>${rows.map(({c,ev,nd,near,sm})=>`
      <tr onclick="openDetail('${c.id}')">
        <td><div class="company-name">${esc(c.name)}</div><div class="company-role">${esc(c.role)}</div></td>
        <td><span class="status-badge" style="background:${sm.color}22;color:${sm.color}">${sm.label}</span></td>
        <td>${ev?esc(ev.type):'<span style="color:#ccc">—</span>'}</td>
        <td><span class="${near?'deadline-near':'deadline-ok'}">${nd?fmtDate(nd):'—'}</span></td>
      </tr>`).join('')}
    </tbody></table>`;

  const cards = `<div class="company-cards">${rows.map(({c,ev,nd,near,sm})=>`
    <div class="company-card" onclick="openDetail('${c.id}')">
      <div class="card-left">
        <div class="card-name">${esc(c.name)}</div>
        <div class="card-role">${esc(c.role||'職種未設定')}</div>
        ${ev?`<div class="card-meta">
          <span>${esc(ev.type)}</span>
          <span class="${near?'deadline-near':'deadline-ok'}">${nd?fmtShort(nd):''}</span>
        </div>`:''}
      </div>
      <div class="card-right">
        <span class="status-badge" style="background:${sm.color}22;color:${sm.color}">${sm.label}</span>
        <span style="font-size:18px;color:#ccc">›</span>
      </div>
    </div>`).join('')}</div>`;

  document.getElementById('content').innerHTML = filters + table + cards;
}

function setFilter(s) { filterStatus=s; renderList(); }

// ====== CALENDAR ======
function renderCalendar() {
  const lastDay = new Date(calYear, calMonth+1, 0);
  const startDow = new Date(calYear, calMonth, 1).getDay();
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  const evMap = {};
  companies.forEach(c => (c.events||[]).forEach(e => {
    if (!e.date) return;
    (evMap[e.date] = evMap[e.date]||[]).push({ label:`${c.name}：${e.type}`, color:STATUS_META[c.status].color });
  }));

  const total = Math.ceil((startDow + lastDay.getDate()) / 7) * 7;
  let cells = '';
  for (let i=0; i<total; i++) {
    const d = i - startDow + 1;
    if (d<1 || d>lastDay.getDate()) { cells+=`<div class="cal-cell other-month"></div>`; continue; }
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = evMap[ds]||[], shown = evs.slice(0,2), more = evs.length-2;
    cells += `<div class="cal-cell ${ds===todayStr?'today':''}">
      <div class="cal-date">${d}</div>
      ${shown.map(e=>`<div class="cal-event" style="background:${e.color}">${esc(e.label)}</div>`).join('')}
      ${more>0?`<div class="cal-more">+${more}件</div>`:''}
    </div>`;
  }

  document.getElementById('content').innerHTML = `
    <div class="cal-header">
      <button class="cal-nav" onclick="calNav(-1)">‹</button>
      <h3>${calYear}年 ${months[calMonth]}</h3>
      <button class="cal-nav" onclick="calNav(1)">›</button>
      <button class="btn-secondary" style="margin-left:auto;font-size:12px;padding:6px 12px;" onclick="calToday()">今月</button>
    </div>
    <div class="cal-grid">
      ${['日','月','火','水','木','金','土'].map(d=>`<div class="cal-day-header">${d}</div>`).join('')}
      ${cells}
    </div>`;
}

function calNav(dir) {
  calMonth += dir;
  if (calMonth>11) { calMonth=0; calYear++; }
  if (calMonth<0)  { calMonth=11; calYear--; }
  renderCalendar();
}
function calToday() { calYear=today.getFullYear(); calMonth=today.getMonth(); renderCalendar(); }

// ====== MODAL ======
let eventFields = [];
function handleOverlayClick(e) { if (e.target===e.currentTarget) closeModal(); }

function openModal(id) {
  editingId = id||null; eventFields = [];
  document.getElementById('event-list').innerHTML = '';
  document.getElementById('btn-delete').style.display = id ? 'block' : 'none';
  document.getElementById('modal-title').textContent = id ? '企業を編集' : '企業を追加';
  if (id) {
    const c = companies.find(x=>x.id===id);
    document.getElementById('f-name').value   = c.name;
    document.getElementById('f-role').value   = c.role||'';
    document.getElementById('f-status').value = c.status;
    document.getElementById('f-note').value   = c.note||'';
    (c.events||[]).forEach(e=>addEventField(e));
  } else {
    ['f-name','f-role','f-note'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-status').value = 'es';
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function addEventField(ev) {
  const idx = eventFields.length;
  eventFields.push(ev ? {...ev} : {type:'ES締切', date:''});
  const div = document.createElement('div');
  div.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;';
  div.innerHTML = `
    <select onchange="eventFields[${idx}].type=this.value"
      style="padding:10px 8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;color:var(--text);-webkit-appearance:none;">
      ${EVENT_TYPES.map(t=>`<option value="${t}" ${ev?.type===t?'selected':''}>${t}</option>`).join('')}
    </select>
    <div style="display:flex;gap:6px;align-items:center;">
      <input type="date" value="${ev?.date||''}" onchange="eventFields[${idx}].date=this.value"
        style="flex:1;padding:10px 6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--text);">
      <button onclick="this.closest('div[style]').remove();eventFields[${idx}]=null;"
        style="border:none;background:none;cursor:pointer;color:#bbb;font-size:20px;padding:0 2px;flex-shrink:0;">✕</button>
    </div>`;
  document.getElementById('event-list').appendChild(div);
}

function saveCompany() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('企業名を入力してください'); return; }
  const evs = eventFields.filter(Boolean).filter(e=>e.date);
  const data = {
    name, role: document.getElementById('f-role').value.trim(),
    status: document.getElementById('f-status').value,
    note: document.getElementById('f-note').value.trim(),
    events: evs
  };
  if (editingId) {
    const i = companies.findIndex(c=>c.id===editingId);
    companies[i] = {...companies[i], ...data};
  } else {
    companies.push({id:genId(), ...data});
  }
  save(); closeModal(); closeDetail(); render();
}

function deleteCompany() {
  if (!confirm('この企業を削除しますか？')) return;
  companies = companies.filter(c=>c.id!==editingId);
  save(); closeModal(); closeDetail(); render();
}

// ====== DETAIL ======
function openDetail(id) {
  const c = companies.find(x=>x.id===id), sm = STATUS_META[c.status];
  document.getElementById('detail-drag').style.display = mobile() ? 'block' : 'none';

  const evHtml = (c.events||[]).filter(e=>e.date)
    .sort((a,b)=>new Date(a.date)-new Date(b.date))
    .map(e=>`
      <div class="event-item">
        <div class="event-dot" style="background:${sm.color}"></div>
        <div><div class="ev-title">${esc(e.type)}</div><div class="ev-date">${fmtDate(e.date)}</div></div>
      </div>`).join('') || '<p style="color:var(--text-muted);font-size:13px">イベントなし</p>';

  document.getElementById('detail-content').innerHTML = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;">
      <h3>${esc(c.name)}</h3>
      <button onclick="closeDetail()" style="border:none;background:none;cursor:pointer;font-size:22px;color:#bbb;padding:0 0 0 8px;">✕</button>
    </div>
    <div class="detail-role">${esc(c.role||'職種未設定')}</div>
    <span class="status-badge" style="background:${sm.color}22;color:${sm.color};margin-bottom:20px;display:inline-block">${sm.label}</span>
    <div class="detail-section"><h4>イベント・締め切り</h4>${evHtml}</div>
    ${c.note?`<div class="detail-section"><h4>メモ</h4><div class="detail-note">${esc(c.note)}</div></div>`:''}
    <div class="detail-actions">
      <button class="btn-secondary" style="flex:1" onclick="openModal('${c.id}')">編集</button>
    </div>`;

  document.getElementById('detail-overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
}

    ]},
    {id:genId(), name:'テック株式会社', role:'デザイナー', status:'offer', note:'第一志望', events:[]},
